# Desenvolvimento: db persistente + serviço web (runserver) do HMD.
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# O overlay soma ao docker-compose.yml: volume persistente do db e o serviço
# web com live-reload (mount do código-fonte). O .venv do host nunca vaza:
# um volume dedicado guarda as dependências, sincronizadas no start do
# container com `uv sync --frozen` (idempotente quando o lock está satisfeito).

name: hmd-dev

services:
  db:
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "uv sync --frozen &&
             uv run python manage.py runserver 0.0.0.0:8000 --settings=config.settings.dev"
    ports:
      - "8080:8000"
    volumes:
      - .:/app
      - app_venv:/app/.venv
      - media_data:/app/media
    environment:
      DATABASE_URL: postgres://hmd:hmd_dev@db:5432/hmd_dev
      DJANGO_SECRET_KEY: dev-secret-key-not-for-production
      DJANGO_DEBUG: "true"
      # Com o worker-pdf no ar, o web enfileira (nunca processa inline 2×).
      INTAKE_RUN_TASKS_INLINE: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hmd-net
    stdin_open: true
    tty: true

  # Worker do cluster pdf do django-q2 (design D2/R5): consome o cluster
  # alternativo "pdf" (extração) em um processo dedicado; o cluster default
  # "hmd" não é executado no compose dev. Compartilha o volume de media com o
  # web (mesmo MEDIA_ROOT) — os PDFs gravados no upload são lidos aqui.
  worker-pdf:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "uv sync --frozen &&
             uv run python manage.py qcluster --settings=config.settings.dev"
    volumes:
      - .:/app
      - app_venv:/app/.venv
      - media_data:/app/media
    environment:
      DATABASE_URL: postgres://hmd:hmd_dev@db:5432/hmd_dev
      DJANGO_SECRET_KEY: dev-secret-key-not-for-production
      DJANGO_DEBUG: "true"
      Q_CLUSTER_NAME: pdf
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hmd-net

volumes:
  pgdata_dev:
  app_venv:
