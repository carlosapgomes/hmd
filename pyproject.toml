[project]
name = "hmd"
version = "0.1.1"
description = "Sistema de apoio à regulação de pacientes do serviço de hemodinâmica (HGRS)."
requires-python = ">=3.13,<3.15"  # Presidio declara <3.15 (pesquisa §3) — trava o salto acidental
dependencies = [
    "django>=5.2,<6",
    "psycopg[binary]",
    "whitenoise",
    # Servidor WSGI de produção (change pilot-deployment-v0-1-1, slice 001/R1,
    # design D1): CMD da imagem, logs em stdout/stderr — deploy é parte do
    # produto, não do host.
    "gunicorn>=23,<24",
    "python-dotenv",
    "dj-database-url",
    # Cliente Kerberos puro em Python para validação de senha AD (D1).
    # Fixado: superfície pequena/menos auditada exige pin exato.
    "minikerberos==0.4.9",
    # FSM de casos (change 03, D1 confirmada): django-fsm-2 (MIT), drop-in da
    # API django-fsm (@transition/FSMField(protected=True)/signals).
    "django-fsm-2==4.2.4",
    # Extração de texto de PDF do relatório (change intake-nir-upload, slice
    # 002, design D3). Fixado: a suíte gera PDFs de fixture com a API de
    # escrita do PyMuPDF — versão exata travada no lockfile.
    "pymupdf==1.28.2",
    "django-q2==1.10.0",
    # Anonimização (change presidio-anonymization, slice 002, design D1/R1):
    # Presidio 2.2.364 (MIT — pesquisa §3) + spaCy 3.8.x. O modelo pt-BR
    # pt_core_news_lg 3.8.0 (~541 MB) entra via [tool.uv.sources] ao final
    # deste arquivo — instalação determinística no `uv sync`, nunca em runtime.
    "presidio-analyzer==2.2.364",
    "presidio-anonymizer==2.2.364",
    "spacy==3.8.*",
    "pt-core-news-lg",
    # Cliente OpenAI-compatível da OpenRouter (change llm-pipeline-per-type,
    # slice 001, design D1). Fixado: SDK de serviço externo com contrato de
    # erros mapeado por tipo no cliente (apps/pipeline/llm.py) — versão
    # resolvida pelo uv e pinada exata.
    "openai==3.8.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "ruff",
    "mypy",
    "django-stubs",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["migrations", ".pi"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # line length handled by the formatter

[tool.ruff.lint.isort]
known-first-party = ["config", "apps"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
addopts = ["--reuse-db"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.13"
strict = true
explicit_package_bases = true

# Dependências do minikerberos 0.4.9 sem stubs/py.typed (ad-kerberos D1):
# importadas apenas como valores não-tipados no wrapper de apps/accounts/kerberos.py.
[[tool.mypy.overrides]]
module = [
    "minikerberos.*",
    "asysocks.*",
    "asn1crypto.*",
    "unicrypto.*",
    "oscrypto.*",
]
ignore_missing_imports = true

# django-q2 1.10.0 sem py.typed (intake-nir-upload, slice 003): enqueue via
# ``async_task`` é chamada não-tipada do worker (apps/intake/tasks.py); os
# models do app também são varridos pelo plugin do django-stubs via
# INSTALLED_APPS — sem stubs, o pacote entra como Any.
[[tool.mypy.overrides]]
module = ["django_q.*"]
ignore_missing_imports = true

# spaCy 3.8.x e PyYAML sem py.typed (presidio-anonymization, slice 002):
# entram como Any no mypy strict. Os pacotes presidio declaram py.typed
# (parcial) — chamadas não anotadas do pacote recebem ``type: ignore`` local
# com justificativa (engine.py), nunca silêncio de módulo inteiro.
[[tool.mypy.overrides]]
module = [
    "spacy.*",
    "yaml",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.uv.sources]
# Modelo spaCy pt-BR travado por URL do release (design D1/R1): baixado no
# `uv sync`, nunca em runtime. Fonte = release oficial do spaCy (determinístico
# via lockfile; o cache do uv evita re-download em estações que já o têm).
pt-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/pt_core_news_lg-3.8.0/pt_core_news_lg-3.8.0-py3-none-any.whl" }
