# Compose produtivo do piloto HMD — change pilot-deployment-v0-1-1, slices 003 e
# 005 (design D4). Arquivo AUTÔNOMO: `docker compose -f docker-compose.prod.yml …`
# (o compose de dev é outro arquivo e não participa do piloto).
#
# Ordem do deploy (sem depends_on bloqueante — a dependência do web com o
# migrate é de DADOS, não de processo):
#   1) docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate
#   2) docker compose -f docker-compose.prod.yml up -d web
#   3) workers/egress/intake seguem DESLIGADOS na fase 1 (profile "workers")
#
# Topologia (tudo que é externo é gerido FORA deste repo):
# - hospital_ingress_hmd: o Caddy do host é o upstream — alcança o web pelo
#   ALIAS estável `hmd` na porta 8000 (independente do nome gerado pelo
#   compose). O web NÃO publica porta no host (expose apenas); publicar
#   `ports` furaria o TLS terminado no proxy.
# - hospital-db-hmd: PostgreSQL 17/18 COMPARTILHADO, DB `app_hmd`. O serviço de
#   PG e seus aliases de rede (postgres-app-hmd / hmd) pertencem ao compose
#   externo; aqui as settings são montadas por DB_* (o compose não usa mais
#   URL de banco com senha embutida).
# - hospital_egress_hmd: saída restrita da rede. O web sai apenas para
#   AD/DNS/Kerberos; os workers de LLM/OCR (desligados na fase 1) usam a mesma
#   rede quando ativados. Os workers de pdf/anonymization não saem.
# - Segredos (slice 005/R3): SEMPRE por ARQUIVO read-only (top-level `secrets`),
#   um segredo por consumidor — web/workers montam `secret_key` +
#   `app_db_password`; migrate monta `secret_key` + `migrator_db_password` +
#   `superuser_password`. Nenhum valor de segredo entra em env/Git; os
#   arquivos do host ficam fora do Git (`.gitignore`: `secrets/`).
# - Logs: json-file rotacionado por serviço (max-size 10m, max-file 3); o
#   gunicorn do CMD do Dockerfile escreve em stdout/stderr.
# - Imagem: pronta do GHCR (amd64, release v*) com o CMD de produção do
#   Dockerfile — nenhum build acontece aqui. Fixe SEMPRE tag+digest no .env do
#   host (`HMD_IMAGE_TAG=v0.1.6@sha256:<digest>`): a tag sozinha é mutável.

name: hmd-prod

services:
  # Web de produção (gunicorn, CMD do Dockerfile): somente a imagem pronta,
  # sem bind de código e sem porta publicada.
  web:
    image: ghcr.io/carlosapgomes/hmd:${HMD_IMAGE_TAG:-v0.1.6}
    restart: unless-stopped
    stop_grace_period: 40s
    # Limites de recurso — PLANEJADOS/INICIAIS da fase 1 (blueprint/Eon,
    # 2026-09-11): gunicorn 3×2 sem spaCy no processo web. A revisar por
    # observação em produção; workers (fase 2) exigirão faixas PRÓPRIAS
    # (worker-anonymization carrega spaCy lg: sugerir 1536m–2048m lá).
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 200
    # Não-root ATIVO (change image-hardening-v0-1-4, slice 002): o Dockerfile
    # declara o usuário dedicado uid/gid 10001 e `/app/media` com o ownership
    # dele — nenhum processo deste serviço tem privilégio de root. As
    # mitigações seguem como DEFESA EM PROFUNDIDADE: rootfs read-only (escritas
    # só no volume media e no tmpfs /tmp), sem novos privilégios e todos os
    # caps derrubados.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # expose = documenta a porta interna para a rede do compose; o Caddy do
    # host (hospital_ingress_hmd) é quem publica externamente.
    expose:
      - "8000"
    environment:
      # Env EXPLÍCITA (defesa em profundidade): o config/wsgi.py passou a
      # defaultar para config.settings.prod no slice 001 do change
      # image-hardening-v0-1-4, mas o gunicorn NÃO aceita --settings — o
      # deploy declara o settings aqui em vez de depender do default.
      DJANGO_SETTINGS_MODULE: config.settings.prod
      # Banco por componentes (slice 005/R1): credencial da APLICAÇÃO (DML) lida
      # do arquivo do secret — a de migrator fica só no serviço `migrate`.
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/app_db_password
      DJANGO_SECRET_KEY_FILE: /run/secrets/secret_key
      # P0 review: o healthcheck interno usa Host 127.0.0.1:8000 — sem ele
      # em ALLOWED_HOSTS, DisallowedHost vira 400 e o container fica
      # permanentemente unhealthy (DEBUG=False valida Host em toda request).
      ALLOWED_HOSTS: ${ALLOWED_HOSTS},127.0.0.1
      # P1 review final: sem default, o compose injeta string vazia e
      # anula o default das settings (CSRF 403 no login pela URL pública).
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://hmd.projetoshgrs.com}
      PROXY_SSL_HEADER: ${PROXY_SSL_HEADER:-true}
      # Fase 1 do piloto: intake DESLIGADO (fail-closed — o default de
      # config.settings.prod é false e aqui ele fica explícito).
      INTAKE_ENABLED: ${INTAKE_ENABLED:-false}
      # Limites do envio em lote (change intake-batch-semantics): 1 PDF = 1
      # caso; o total default de 100 MB é o limite prático do request body no
      # túnel Cloudflare do piloto (~100 MB no plano free). Sempre com
      # ${VAR:-default} — sem o default, o compose injetaria string vazia e
      # anularia o valor das settings.
      INTAKE_MAX_FILES_PER_BATCH: ${INTAKE_MAX_FILES_PER_BATCH:-30}
      INTAKE_MAX_UPLOAD_BYTES_PER_FILE: ${INTAKE_MAX_UPLOAD_BYTES_PER_FILE:-20971520}
      INTAKE_MAX_UPLOAD_BYTES_PER_BATCH: ${INTAKE_MAX_UPLOAD_BYTES_PER_BATCH:-104857600}
      # Login AD/Kerberos (egress restrito) + guard de intranet do papel nir.
      AD_DCS: ${AD_DCS}
      AD_KDC_TIMEOUT: ${AD_KDC_TIMEOUT:-3}
      INTRANET_IP_RANGE: ${INTRANET_IP_RANGE}
      INTRANET_RESTRICTED_ROLES: ${INTRANET_RESTRICTED_ROLES:-nir}
      # Rótulos das unidades de agendamento (change unit-labels-env): exibidos
      # no produto e na resposta final ao NIR da unidade 2.
      HMD_UNIT_1_LABEL: ${HMD_UNIT_1_LABEL:-Unidade 1}
      HMD_UNIT_2_LABEL: ${HMD_UNIT_2_LABEL:-Unidade 2}
      # Topologia do piloto (Cloudflared → Caddy → HMD): a borda Cloudflare
      # fixa Cf-Connecting-IP com o cliente real e o túnel o preserva até a
      # origem; o Caddy repassa headers de entrada SEM tocá-los (NÃO usar
      # header_up X-Forwarded-For {remote_host} neste hop — gravaria o IP do
      # cloudflared e o guard de intranet nunca casaria). Default = default
      # do código desde o change 02. XFF só vale em topologia Caddy-direto.
      TRUSTED_PROXY_HEADER: ${TRUSTED_PROXY_HEADER:-HTTP_CF_CONNECTING_IP}
      # Anti-lockout local no cache compartilhado (tabela hmd_cache).
      LOGIN_ATTEMPTS_LIMIT: ${LOGIN_ATTEMPTS_LIMIT:-5}
      LOGIN_ATTEMPTS_WINDOW_SECONDS: ${LOGIN_ATTEMPTS_WINDOW_SECONDS:-900}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-900}
      APP_DISPLAY_NAME: ${APP_DISPLAY_NAME:-HMD — Hemodinâmica}
      # Nunca processar inline no processo web (fase 1: nada é enfileirado —
      # intake desligado e workers sob profile desligado).
      INTAKE_RUN_TASKS_INLINE: "false"
      ANONYMIZATION_RUN_TASKS_INLINE: "false"
      LLM_RUN_TASKS_INLINE: "false"
      ATTACHMENTS_RUN_TASKS_INLINE: "false"
    # Segredo consumido pelo web: chave da aplicação + senha da role da aplicação.
    secrets:
      - secret_key
      - app_db_password
    volumes:
      - media_data:/app/media
    # Readiness com BARRA (/readyz/): a rota é isenta do IntranetGuard e faz
    # SELECT 1 + toque no cache; sem barra o teste seguiria um 301 e não
    # provaria a prontidão real. python:3.13-slim não tem curl — urllib é o
    # cliente disponível na imagem.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      # Alias estável `hmd` (slice 005/R4): o upstream do Caddy é SEMPRE
      # `hmd:8000`, independente do nome `<projeto>-<serviço>-<n>` que o Docker
      # geraria — o deploy pode renomear/reprojetar sem tocar no Caddy.
      hospital_ingress_hmd:
        aliases:
          - hmd
      hospital-db-hmd:
      hospital_egress_hmd:

  # Passo one-shot (profile "migrate"): migrate + tabela do cache + seeds
  # idempotentes. Usa a credencial de MIGRATOR (DDL), nunca a da aplicação.
  # `restart: "no"`: roda uma vez e sai (invocado com `run --rm migrate`).
  migrate:
    image: ghcr.io/carlosapgomes/hmd:${HMD_IMAGE_TAG:-v0.1.6}
    profiles: ["migrate"]
    restart: "no"
    command: >
      sh -c "python manage.py migrate --settings=config.settings.prod &&
             python manage.py createcachetable hmd_cache --settings=config.settings.prod &&
             python manage.py seed_admin --settings=config.settings.prod &&
             python manage.py seed_prompts --settings=config.settings.prod &&
             python manage.py seed_procedure_catalog --settings=config.settings.prod"
    environment:
      # Banco por componentes (slice 005/R1/R3): role de MIGRATOR (DDL) lida do
      # arquivo do secret — nunca a credencial da aplicação.
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${MIGRATOR_DB_USER}
      DB_PASSWORD_FILE: /run/secrets/migrator_db_password
      DJANGO_SECRET_KEY_FILE: /run/secrets/secret_key
      # Consumidas pelo `seed_admin` (ele falha fechado sem username e senha;
      # a senha vem do ARQUIVO do secret — username é env não-sensível).
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME}
      DJANGO_SUPERUSER_PASSWORD_FILE: /run/secrets/superuser_password
    # Segredos consumidos pelo migrate: chave da aplicação + senha do migrator
    # (DDL) + senha do superusuário do seed.
    secrets:
      - secret_key
      - migrator_db_password
      - superuser_password
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hospital-db-hmd

  # Workers do django-q2 (profile "workers" — DESLIGADO na fase 1 do piloto):
  # cada serviço consome um cluster alternativo via Q_CLUSTER_NAME usando a
  # imagem pronta (sem `uv sync`/bind de código) e compartilha o volume de
  # media quando precisa ler/gravar arquivos.
  #
  # As envs OPENROUTER_API_KEY/LLM*_MODEL/VISION_MODEL NÃO entram na fase 1 —
  # ativam junto com este profile e a rede de egress na próxima mudança.

  # Cluster pdf: extração de texto dos relatórios enviados (o web grava o PDF
  # no volume compartilhado e enfileira; este processo lê). Ao concluir, o
  # signal enfileira no cluster anonymization.
  worker-pdf:
    image: ghcr.io/carlosapgomes/hmd:${HMD_IMAGE_TAG:-v0.1.6}
    profiles: ["workers"]
    restart: unless-stopped
    stop_grace_period: 40s
    command: python manage.py qcluster --settings=config.settings.prod
    volumes:
      - media_data:/app/media
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/app_db_password
      DJANGO_SECRET_KEY_FILE: /run/secrets/secret_key
      Q_CLUSTER_NAME: pdf
      INTAKE_ENABLED: "false"
      INTAKE_RUN_TASKS_INLINE: "false"
      ANONYMIZATION_RUN_TASKS_INLINE: "false"
      LLM_RUN_TASKS_INLINE: "false"
      ATTACHMENTS_RUN_TASKS_INLINE: "false"
    secrets:
      - secret_key
      - app_db_password
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hospital-db-hmd

  # Cluster anonymization: único processo que carrega o engine Presidio/spaCy
  # (singleton; o modelo vive na imagem). Não sai para a rede (nenhum egress).
  worker-anonymization:
    image: ghcr.io/carlosapgomes/hmd:${HMD_IMAGE_TAG:-v0.1.6}
    profiles: ["workers"]
    restart: unless-stopped
    stop_grace_period: 40s
    command: python manage.py qcluster --settings=config.settings.prod
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/app_db_password
      DJANGO_SECRET_KEY_FILE: /run/secrets/secret_key
      Q_CLUSTER_NAME: anonymization
      INTAKE_ENABLED: "false"
      INTAKE_RUN_TASKS_INLINE: "false"
      ANONYMIZATION_RUN_TASKS_INLINE: "false"
      LLM_RUN_TASKS_INLINE: "false"
      ATTACHMENTS_RUN_TASKS_INLINE: "false"
    secrets:
      - secret_key
      - app_db_password
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hospital-db-hmd

  # Cluster llm: pipeline LLM1/LLM2 (OpenRouter) num processo dedicado. Ao
  # concluir a anonimização, o signal enfileira aqui (nunca inline no worker
  # de anonimização).
  worker-llm:
    image: ghcr.io/carlosapgomes/hmd:${HMD_IMAGE_TAG:-v0.1.6}
    profiles: ["workers"]
    restart: unless-stopped
    stop_grace_period: 40s
    command: python manage.py qcluster --settings=config.settings.prod
    volumes:
      - media_data:/app/media
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/app_db_password
      DJANGO_SECRET_KEY_FILE: /run/secrets/secret_key
      Q_CLUSTER_NAME: llm
      INTAKE_ENABLED: "false"
      INTAKE_RUN_TASKS_INLINE: "false"
      ANONYMIZATION_RUN_TASKS_INLINE: "false"
      LLM_RUN_TASKS_INLINE: "false"
      ATTACHMENTS_RUN_TASKS_INLINE: "false"
    secrets:
      - secret_key
      - app_db_password
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hospital-db-hmd
      - hospital_egress_hmd

  # Cluster attachments: OCR híbrido dos anexos (extração local + transcrição
  # externa). Dispara no CASE_ANONYMIZATION_COMPLETED, em paralelo ao cluster
  # llm (nunca inline no worker de anonimização).
  worker-attachments:
    image: ghcr.io/carlosapgomes/hmd:${HMD_IMAGE_TAG:-v0.1.6}
    profiles: ["workers"]
    restart: unless-stopped
    stop_grace_period: 40s
    command: python manage.py qcluster --settings=config.settings.prod
    volumes:
      - media_data:/app/media
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/app_db_password
      DJANGO_SECRET_KEY_FILE: /run/secrets/secret_key
      Q_CLUSTER_NAME: attachments
      INTAKE_ENABLED: "false"
      INTAKE_RUN_TASKS_INLINE: "false"
      ANONYMIZATION_RUN_TASKS_INLINE: "false"
      LLM_RUN_TASKS_INLINE: "false"
      ATTACHMENTS_RUN_TASKS_INLINE: "false"
    secrets:
      - secret_key
      - app_db_password
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hospital-db-hmd
      - hospital_egress_hmd

# Segredos por ARQUIVO (slice 005/R3): o caminho no host é configurável por
# env (`*_FILE`), com default em `./secrets/` (fora do Git). Cada serviço monta
# APENAS os segredos que consome, read-only, em /run/secrets/<nome>.
secrets:
  app_db_password:
    file: ${APP_DB_PASSWORD_FILE:-./secrets/app_db_password.txt}
  migrator_db_password:
    file: ${MIGRATOR_DB_PASSWORD_FILE:-./secrets/migrator_db_password.txt}
  secret_key:
    file: ${SECRET_KEY_FILE:-./secrets/secret_key.txt}
  superuser_password:
    file: ${SUPERUSER_PASSWORD_FILE:-./secrets/superuser_password.txt}

# Redes EXTERNAS (geridas fora do repo — o `docker network create` e o IPAM
# são da infra do hospital). O PostgreSQL compartilhado e seus aliases vivem
# no compose externo; aqui apenas consumimos os nomes.
networks:
  hospital-db-hmd:
    external: true
  hospital_ingress_hmd:
    external: true
  hospital_egress_hmd:
    external: true

# Media compartilhada entre o web e os workers que tocam arquivos
# (pdf/llm/attachments) — mesmo MEDIA_ROOT (/app/media) em todos.
volumes:
  media_data:
