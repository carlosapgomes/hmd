# Desenvolvimento: db persistente + serviço web (runserver) + workers do HMD.
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# O overlay soma ao docker-compose.yml: volume persistente do db, o serviço
# web com live-reload (mount do código-fonte) e os workers do django-q2. Os
# três serviços usam a MESMA imagem construída do Dockerfile (slice 004, R5):
# dependências + modelo spaCy instalados no BUILD. O web dev mantém o fluxo de
# volume/runserver de sempre (bind do código + volume app_venv sincronizados
# com `uv sync --frozen` no start); os workers usam a imagem pronta — sem sync
# no startup e sem bind do código (mudanças nos workers exigem `--build`).
# O .venv do host nunca vaza (volume dedicado no web; imagem no worker).

name: hmd-dev

services:
  db:
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: hmd-dev:app
    # Dev/servidor de teste roda DELIBERADAMENTE como root (uid 0): o fluxo
    # uv sync --frozen escreve no venv do volume app_venv (root-owned), usa o
    # cache do uv e os workers gravam em media root-owned. O endurecimento
    # non-root vale para a imagem de PRODUÇÃO (USER 10001:10001 no Dockerfile,
    # change image-hardening-v0-1-4, slice 002).
    user: "0:0"
    command: >
      sh -c "uv sync --frozen &&
             uv run python manage.py runserver 0.0.0.0:8000 --settings=config.settings.dev"
    ports:
      - "8080:8000"
    volumes:
      - .:/app
      - app_venv:/app/.venv
      - media_data:/app/media
    environment:
      DATABASE_URL: postgres://hmd:hmd_dev@db:5432/hmd_dev
      DJANGO_SECRET_KEY: dev-secret-key-not-for-production
      DJANGO_DEBUG: "true"
      # Com os workers no ar, o web enfileira (nunca processa inline 2×); a
      # anonimização e o pipeline LLM também nunca rodam inline no processo web
      # (o modelo spaCy vive no worker-anonymization; a OpenRouter é chamada
      # apenas pelo worker-llm — design D7/D9).
      INTAKE_RUN_TASKS_INLINE: "false"
      ANONYMIZATION_RUN_TASKS_INLINE: "false"
      LLM_RUN_TASKS_INLINE: "false"
      ATTACHMENTS_RUN_TASKS_INLINE: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hmd-net
    stdin_open: true
    tty: true

  # Worker do cluster pdf do django-q2 (extração, design D2/R5): consome o
  # cluster alternativo "pdf" em um processo dedicado usando a IMAGEM PRONTA
  # (deps+modelo no build, sem `uv sync`/bind do código); o cluster default
  # "hmd" não é executado no compose dev. Compartilha o volume de media com o
  # web (mesmo MEDIA_ROOT) — os PDFs gravados no upload são lidos aqui. Ao
  # concluir a extração (entrada em ANONYMIZING), o signal enfileira no
  # cluster anonymization (nunca inline no processo do pdf).
  worker-pdf:
    build:
      context: .
      dockerfile: Dockerfile
    image: hmd-dev:app
    user: "0:0"
    command: python manage.py qcluster --settings=config.settings.dev
    volumes:
      - media_data:/app/media
    environment:
      DATABASE_URL: postgres://hmd:hmd_dev@db:5432/hmd_dev
      DJANGO_SECRET_KEY: dev-secret-key-not-for-production
      DJANGO_DEBUG: "true"
      Q_CLUSTER_NAME: pdf
      INTAKE_RUN_TASKS_INLINE: "false"
      ANONYMIZATION_RUN_TASKS_INLINE: "false"
      LLM_RUN_TASKS_INLINE: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hmd-net

  # Worker do cluster anonymization do django-q2 (slice 004, R5): consome o
  # cluster alternativo "anonymization" — o único processo que carrega o
  # engine Presidio/spaCy (singleton; o modelo vive na imagem do build).
  worker-anonymization:
    build:
      context: .
      dockerfile: Dockerfile
    image: hmd-dev:app
    user: "0:0"
    command: python manage.py qcluster --settings=config.settings.dev
    environment:
      DATABASE_URL: postgres://hmd:hmd_dev@db:5432/hmd_dev
      DJANGO_SECRET_KEY: dev-secret-key-not-for-production
      DJANGO_DEBUG: "true"
      Q_CLUSTER_NAME: anonymization
      # Camada NER/Presidio OPT-IN (default false): com o NER desligado o engine
      # nem é construído neste worker (memória cai); a reativação
      # (ANONYMIZATION_USE_NER=true no .env) chega por este passthrough.
      ANONYMIZATION_USE_NER: ${ANONYMIZATION_USE_NER:-false}
      INTAKE_RUN_TASKS_INLINE: "false"
      ANONYMIZATION_RUN_TASKS_INLINE: "false"
      LLM_RUN_TASKS_INLINE: "false"
      ATTACHMENTS_RUN_TASKS_INLINE: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hmd-net

  # Worker do cluster llm do django-q2 (change llm-pipeline-per-type, slice
  # 006, R6): consome o cluster alternativo "llm" — o pipeline LLM1/LLM2
  # (chamadas à OpenRouter) num processo dedicado usando a imagem pronta. Ao
  # concluir a anonimização (entrada em LLM_EXTRACTING), o signal enfileira no
  # cluster llm (nunca inline no processo do worker de anonimização).
  worker-llm:
    build:
      context: .
      dockerfile: Dockerfile
    image: hmd-dev:app
    user: "0:0"
    command: python manage.py qcluster --settings=config.settings.dev
    volumes:
      - media_data:/app/media
    environment:
      DATABASE_URL: postgres://hmd:hmd_dev@db:5432/hmd_dev
      DJANGO_SECRET_KEY: dev-secret-key-not-for-production
      DJANGO_DEBUG: "true"
      Q_CLUSTER_NAME: llm
      # Reativação consistente do NER (o llm anonimiza o motivo do caso anterior
      # via prior_case): sem isto, ligar a env deixaria posturas mistas.
      ANONYMIZATION_USE_NER: ${ANONYMIZATION_USE_NER:-false}
      # Fase 2 em dev (paridade com o prod, estilo dev sem secret-file): a
      # chave/modelos entram pelo .env local (gitignored) — sem eles o
      # pipeline falha fechado em auth/config no estágio LLM (esperado).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM1_MODEL: ${LLM1_MODEL:-}
      LLM2_MODEL: ${LLM2_MODEL:-}
      INTAKE_RUN_TASKS_INLINE: "false"
      ANONYMIZATION_RUN_TASKS_INLINE: "false"
      LLM_RUN_TASKS_INLINE: "false"
      ATTACHMENTS_RUN_TASKS_INLINE: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hmd-net

  # Worker do cluster attachments do django-q2 (change
  # attachment-processing-ocr, slice 002/D7): OCR híbrido dos anexos —
  # extração local (PyMuPDF) e transcrição externa (VISION_MODEL) num
  # processo dedicado usando a imagem pronta. Dispara via signal ao
  # CASE_ANONYMIZATION_COMPLETED (paralelo ao cluster llm, nunca inline
  # no worker de anonimização).
  worker-attachments:
    build:
      context: .
      dockerfile: Dockerfile
    image: hmd-dev:app
    user: "0:0"
    command: python manage.py qcluster --settings=config.settings.dev
    volumes:
      - media_data:/app/media
    environment:
      DATABASE_URL: postgres://hmd:hmd_dev@db:5432/hmd_dev
      DJANGO_SECRET_KEY: dev-secret-key-not-for-production
      DJANGO_DEBUG: "true"
      Q_CLUSTER_NAME: attachments
      VISION_MODEL: ${VISION_MODEL:-}
      # Camada NER/Presidio OPT-IN (default false): este worker também anonimiza
      # anexos — a reativação chega por este passthrough.
      ANONYMIZATION_USE_NER: ${ANONYMIZATION_USE_NER:-false}
      INTAKE_RUN_TASKS_INLINE: "false"
      ANONYMIZATION_RUN_TASKS_INLINE: "false"
      LLM_RUN_TASKS_INLINE: "false"
      ATTACHMENTS_RUN_TASKS_INLINE: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hmd-net

volumes:
  pgdata_dev:
  app_venv:
