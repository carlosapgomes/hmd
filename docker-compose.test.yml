# Teste: PostgreSQL efêmero e isolado para a suíte pytest.
# Uso: docker compose -f docker-compose.test.yml up -d
#      uv run pytest
#      docker compose -f docker-compose.test.yml down
#
# Dados em tmpfs (nada persiste); banco hmd_test; porta host
# ${TEST_DB_PORT:-5433} — ajuste a variável (mesma lida por
# config/settings/test.py) para evitar colisão com outro PostgreSQL.

name: hmd-test

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: hmd
      POSTGRES_PASSWORD: hmd_dev
      POSTGRES_DB: hmd_test
    ports:
      - "${TEST_DB_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data:noexec
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmd -d hmd_test"]
      interval: 2s
      timeout: 3s
      retries: 10
