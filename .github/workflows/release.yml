# Pipeline de release do piloto (change pilot-deployment-v0-1-1, slice 004/R1,
# design D5): em tag `v*` constrói a imagem linux/amd64 e publica no GHCR com a
# tag da versão + `latest`; o passo final imprime o digest da imagem para o
# reporte do gate 4.1. A tag v0.1.1 só é empurrada APÓS o review final — este
# workflow não cria tags nem releases.
name: release

on:
  push:
    tags:
      - "v*"

# Permissão mínima: ler o repositório e publicar pacotes (imagem) no GHCR.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      # Autenticação no GHCR com o token efêmero do próprio workflow (nenhum
      # secret armazenado: `github.token` é read-only no repositório e tem
      # `packages: write` pela permissão acima).
      - name: login ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Tags/labels derivados da ref: `type=ref,event=tag` produz a tag da
      # release (v0.1.1, igual ao default de HMD_IMAGE_TAG no compose) e
      # `latest` a acompanha.
      - name: metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/carlosapgomes/hmd
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      # Plataforma única do piloto (design D5); `provenance: false` porque o
      # build é amd64 único e o manifesto extra de attestation não é usado
      # pela topologia do compose.
      - name: build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Digest da imagem publicada, para o reporte do release (gate 4.1).
      - name: digest
        run: |
          docker buildx imagetools inspect ghcr.io/carlosapgomes/hmd:${{ github.ref_name }} | grep Digest || true
